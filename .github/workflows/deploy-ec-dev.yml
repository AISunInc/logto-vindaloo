name: Deploy to EC prod

on:
  push:
    branches:
      - main
      - defaultcountrycode
# This workflow runs on local runners by default.
# If you want to run it on GitHub-hosted runners, uncomment the `runs-on: ubuntu-latest` line below.
# and comment the `runs-on: self-hosted` line.
# REMEMBER: Update this in both the `build` job and the `deploy` job.
jobs:
  build:
    runs-on: self-hosted
    # runs-on: ubuntu-latest

    env:
      IMAGE_NAME_LOGTO: ${{ vars.DH_USERNAME_LOGTO }}/${{ vars.CONTAINER_NAME_LOGTO }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Prepare local cache directory
        run: |
          sudo mkdir -p /opt/actions-cache/docker-prod
          sudo chmod -R 777 /opt/actions-cache/docker-prod

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DH_USERNAME_LOGTO }}
          password: ${{ secrets.DH_PASSWORD_LOGTO }}

      - name: Build and push Docker image
        # run: docker buildx build --platform linux/amd64,linux/arm64  --cache-from type=local,src=/opt/actions-cache/docker-prod --cache-to type=local,dest=/opt/actions-cache/docker-prod,mode=max -t ${{ env.IMAGE_NAME_LOGTO }}:prod --build-arg NODE_ENV=prod --push .
        # it is running on arm64 ,if you want to use both amd and arm  then uncomment above and comment below
        run: docker buildx build --platform linux/arm64  --cache-from type=local,src=/opt/actions-cache/docker-prod --cache-to type=local,dest=/opt/actions-cache/docker-prod,mode=max -t ${{ env.IMAGE_NAME_LOGTO }}:prod --build-arg NODE_ENV=prod --push .

      - name: Cleanup old cache (older than 7 days)
        run: |
          find /opt/actions-cache/docker-prod -type f -mtime +7 -delete || true
          echo "Old cache layers cleaned up (older than 7 days)"

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH to EC2 and pull/run the Docker container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Initializing variables
            CONTAINER_NAME_LOGTO=${{ vars.CONTAINER_NAME_LOGTO }}
            IMAGE_NAME_LOGTO=${{ vars.DH_USERNAME_LOGTO }}/${{ vars.CONTAINER_NAME_LOGTO }}

            # Login to docker
            DOCKER_PAT=${{ secrets.DH_PASSWORD_LOGTO }}
            echo $DOCKER_PAT | docker login --username ${{ vars.DH_USERNAME_LOGTO }} --password-stdin

            # Pull new image
            docker pull $IMAGE_NAME_LOGTO:prod

            # Stop and remove previous containers
            docker stop logto-backend || true
            docker rm logto-backend || true
            docker run -d \
              --name logto-prod \
              --restart always \
              -p 5080:8080 \
              -p 5081:8081 \
              -e PORT=8080 \
              -e ADMIN_PORT=8081 \
              -e TRUST_PROXY_HEADER=1 \
              -e DB_URL="${{ secrets.LOGTO_DB_URL }}" \
              -e ENDPOINT="${{ vars.LOGTO_ENDPOINT }}" \
              -e ADMIN_ENDPOINT="${{ vars.LOGTO_ADMIN_ENDPOINT }}" \
              $IMAGE_NAME


            # Clean up
            docker system prune -f
