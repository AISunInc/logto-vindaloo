name: Deploy to Production (Vindaloo Logto)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod-vindaloo
  cancel-in-progress: false

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: self-hosted

    env:
      IMAGE_NAME: vindalooo/logto
      CACHE_DIR: $HOME/.cache/${{ github.repository }}/docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Docker cache directory
        run: mkdir -p $CACHE_DIR

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=local,src=$CACHE_DIR \
            --cache-to type=local,dest=$CACHE_DIR,mode=max \
            -t vindalooo/logto:prod \
            --push .

  deploy:
    name: Deploy to EC2
    runs-on: self-hosted
    needs: build

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST_VINDALOO }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY_VINDALOO }}
          script: |
            set -e

            IMAGE_NAME=vindalooo/logto
            CONTAINER_NAME=logto-backend-prod

            echo "Login to Docker Hub"
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
              --username ${{ secrets.DOCKERHUB_USERNAME }} \
              --password-stdin

            echo "Saving old container image ID for potential rollback..."
            OLD_IMAGE_ID=$(docker inspect --format='{{.Image}}' $CONTAINER_NAME 2>/dev/null || true)

            echo "Pulling latest prod image..."
            docker pull $IMAGE_NAME:prod

            echo "Stopping and removing existing container..."
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            echo "Launching new container..."
            docker run -d \
              --name $CONTAINER_NAME \
              --restart always \
              -p 5080:8080 \
              -p 5081:8081 \
              -e ADMIN_PORT=8081 \
              -e TRUST_PROXY_HEADER=1 \
              -e DB_URL="${{ secrets.LOGTO_DB_URL }}" \
              -e ENDPOINT="${{ secrets.LOGTO_ENDPOINT }}" \
              -e ADMIN_ENDPOINT="${{ secrets.LOGTO_ADMIN_ENDPOINT }}" \
              -e PORT=8080 \
              $IMAGE_NAME:prod \
              npm run start

            echo "Waiting 20 seconds for container to initialize..."
            sleep 20

            echo "Running health check..."
            if ! curl -f http://localhost:5080/api/status; then
              echo "Health check failed! Initiating rollback..."

              docker stop $CONTAINER_NAME || true
              docker rm $CONTAINER_NAME || true

              if [ -n "$OLD_IMAGE_ID" ]; then
                echo "Rolling back to previous image: $OLD_IMAGE_ID"
                docker run -d \
                  --name $CONTAINER_NAME \
                  --restart always \
                  -p 5080:8080 \
                  -p 5081:8081 \
                  -e ADMIN_PORT=8081 \
                  -e TRUST_PROXY_HEADER=1 \
                  -e DB_URL="${{ secrets.LOGTO_DB_URL }}" \
                  -e ENDPOINT="${{ secrets.LOGTO_ENDPOINT }}" \
                  -e ADMIN_ENDPOINT="${{ secrets.LOGTO_ADMIN_ENDPOINT }}" \
                  -e PORT=8080 \
                  $OLD_IMAGE_ID \
                  npm run start
                echo "Rollback complete. Deployment failed."
              fi

              exit 1
            fi

            echo "Cleaning up unused images..."
            docker image prune -f

            echo "Deployment successful!"

